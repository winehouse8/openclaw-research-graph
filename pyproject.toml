[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-research-graph"
version = "0.1.0"
description = "Continual research system with Neo4j-backed knowledge graph for OpenClaw"
requires-python = ">=3.9"
dependencies = [
  "neo4j>=5.28"
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
research-graph = "research_graph.cli:main"
